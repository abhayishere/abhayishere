name: Update OSS stats

on:
  schedule:
    - cron: "17 3 * * *" # ~08:47 IST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oss-stats.yml"
      - "scripts/update-oss-stats.mjs"

permissions:
  contents: write

concurrency:
  group: oss-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: abhayishere
        run: node scripts/update-oss-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: refresh OSS stats [skip ci]"
          git push
